/* ================= QualityPro Academy (GitHub Pages + Supabase) =================
   Same pattern as the Technician Field Guide: publishable key embedded by
   design, all data access through security-definer RPCs (academy_*), PINs
   hashed server-side, sends queue in localStorage when offline. */
var SB_URL = 'https://nbhkndetjaytevyzqsuh.supabase.co';
var SB_KEY = 'sb_publishable_sT4OYqX5_H-GMiWWoDbpzQ_kSGEk8OD';

function store(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function read(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
var session = read('qpa_session'); // {name, role, token}
function rpc(fn,args){
  return fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(args||{})}).then(function(res){
      if(!res.ok) return res.text().then(function(t){throw new Error(fn+' ('+res.status+') '+t.slice(0,160))});
      return res.json();
    });
}
/* Offline queue: quiz + mock results queue and retry on reconnect. */
function enqueue(item){var q=read('qpa_queue')||[];q.push(item);store('qpa_queue',q)}
var flushing=false;
function flushQueue(){
  if(!session||flushing||!navigator.onLine) return;
  var q=read('qpa_queue')||[]; if(!q.length) return;
  flushing=true;
  (function next(i){
    if(i>=q.length){store('qpa_queue',[]);flushing=false;return}
    var it=q[i];
    rpc(it.fn,it.args).then(function(){next(i+1)},function(){flushing=false});
  })(0);
}
window.addEventListener('online',flushQueue);
function sendProgress(fn,args){
  if(!session) return Promise.resolve(null);
  args.p_token=session.token;
  return rpc(fn,args).catch(function(){ enqueue({fn:fn,args:args}); return null; });
}

function signOut(){ session=null; store('qpa_session',null); me=null; prog=null; tabbar.classList.add('hidden'); setHeader(); renderAuth(); }
function trackModules(){ return MODULES[me.track]; }
function totalModules(){ return trackModules().length; }
function completedSet(){
  var s={}; if(prog&&prog.completed_modules) prog.completed_modules.forEach(function(k){s[k]=true});
  Object.keys(localDone).forEach(function(k){s[k]=true}); return s;
}
function pctDone(){ var s=completedSet(),n=0; trackModules().forEach(function(m){if(s[m.id])n++}); return {n:n,total:totalModules(),pct:totalModules()?Math.round(n/totalModules()*100):0}; }

/* ------------------------------ Auth ------------------------------ */
function renderAuth(){
  tabbar.classList.add('hidden');
  app.innerHTML='<h2>Sign in</h2>'
   +'<div class="card"><label>Your name</label><select id="aName"></select>'
   +'<label>4-digit PIN</label><input id="aPin" type="password" inputmode="numeric" maxlength="4" placeholder="First time? The PIN you enter becomes yours.">'
   +'<div class="err" id="aErr"></div>'
   +'<button class="primary" id="aGo" style="width:100%">Sign in</button>'
   +'<p class="small dim" style="margin-top:10px">New trainee added by your teacher? Pick your name — the PIN you enter now becomes yours.</p></div>'
   +'<div class="seg" id="aSeg"><button data-m="reg" class="on">I\u2019m a new trainee</button><button data-m="teach">Set up as Teacher</button></div>'
   +'<div class="card" id="aForm"></div>';
  var sel=document.getElementById('aName');
  sel.innerHTML=namesCache.length?namesCache.map(function(n){return '<option>'+esc(n.name)+'</option>'}).join(''):'<option value="">— no accounts yet —</option>';
  var mode='reg';
  function drawForm(){
    var f=document.getElementById('aForm');
    if(mode==='reg'){
      f.innerHTML='<h3>Register as a trainee</h3><label>Name</label><input id="rName" autocomplete="name">'
       +'<label>4-digit PIN (make one up — remember it)</label><input id="rPin" type="password" inputmode="numeric" maxlength="4">'
       +'<label>Your path</label><div class="seg" id="rTrack"><button data-t="pest" class="on">Pest Control</button><button data-t="wildlife">Wildlife</button></div>'
       +'<label>Cohort (if your teacher made one)</label><select id="rCohort"><option value="">No cohort yet</option></select>'
       +'<div class="err" id="rErr"></div><button class="primary" id="rGo" style="width:100%">Create my account</button>';
      var track='pest';
      document.querySelectorAll('#rTrack button').forEach(function(b){b.addEventListener('click',function(){track=b.dataset.t;document.querySelectorAll('#rTrack button').forEach(function(x){x.classList.toggle('on',x===b)});drawCohorts()})});
      function drawCohorts(){var cs=document.getElementById('rCohort');cs.innerHTML='<option value="">No cohort yet</option>'+cohortsCache.filter(function(c){return c.track===track}).map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')}
      drawCohorts();
      document.getElementById('rGo').addEventListener('click',function(){
        var name=document.getElementById('rName').value.trim(), pin=document.getElementById('rPin').value.trim(), cid=document.getElementById('rCohort').value||null;
        rpc('academy_register_trainee',{p_name:name,p_pin:pin,p_track:track,p_cohort_id:cid}).then(function(tok){finishSignIn(name,tok)},function(e){document.getElementById('rErr').textContent=friendlyErr(e)});
      });
    } else {
      f.innerHTML='<h3>Teacher setup</h3><p class="small dim">The first teacher account. Teachers can create more teacher accounts by having a colleague register here too.</p>'
       +'<label>Teacher name</label><input id="tName" autocomplete="name">'
       +'<label>4-digit PIN (make one up — remember it)</label><input id="tPin" type="password" inputmode="numeric" maxlength="4">'
       +'<div class="err" id="tErr"></div><button class="primary" id="tGo" style="width:100%">Create teacher account</button>';
      document.getElementById('tGo').addEventListener('click',function(){
        var name=document.getElementById('tName').value.trim(), pin=document.getElementById('tPin').value.trim();
        rpc('academy_create_teacher',{p_name:name,p_pin:pin}).then(function(tok){finishSignIn(name,tok)},function(e){document.getElementById('tErr').textContent=friendlyErr(e)});
      });
    }
  }
  document.querySelectorAll('#aSeg button').forEach(function(b){b.addEventListener('click',function(){mode=b.dataset.m;document.querySelectorAll('#aSeg button').forEach(function(x){x.classList.toggle('on',x===b)});drawForm()})});
  drawForm();
  document.getElementById('aGo').addEventListener('click',function(){
    var name=sel.value, pin=document.getElementById('aPin').value.trim(), err=document.getElementById('aErr');
    if(!name){err.textContent='No account with that name yet — register below first.';return}
    rpc('academy_claim_or_verify_pin',{p_name:name,p_pin:pin}).then(function(tok){
      if(!tok){err.textContent='Wrong PIN. Try again.';return}
      finishSignIn(name,tok);
    },function(e){err.textContent=friendlyErr(e)});
  });
}
function friendlyErr(e){var m=String(e&&e.message||e); if(m.indexOf('already registered')>-1)return 'That name is already registered — sign in above instead.'; if(m.indexOf('PIN must be')>-1)return 'PIN must be exactly 4 digits.'; if(m.indexOf('Failed to fetch')>-1||m.indexOf('NetworkError')>-1)return 'Couldn\u2019t reach the server. Check your connection and try again.'; return m.replace(/^.*?:\s*/,'').slice(0,180)}
function finishSignIn(name,tok){
  if(!tok){renderAuth();return}
  rpc('academy_session_user',{p_token:tok}).then(function(u){
    if(!u){document.getElementById('aErr')&&(document.getElementById('aErr').textContent='Sign-in failed. Try again.');return}
    me=u; session={name:u.name,role:u.role,token:tok}; store('qpa_session',session);
    setHeader(); flushQueue(); enterApp();
  },function(e){alert(friendlyErr(e))});
}
function enterApp(){
  if(me.role==='teacher'){ tabbar.classList.add('hidden'); renderTeacher(); }
  else { tabbar.classList.remove('hidden'); curTab='path'; loadProgress().then(renderTrainee); }
}
function loadProgress(){ return rpc('academy_my_progress',{p_token:session.token}).then(function(p){prog=p; if(p&&p.user)me=Object.assign(me,p.user); setHeader(); return p;},function(){prog=prog||{}; return prog;}); }

/* ------------------------------ Trainee ------------------------------ */
document.querySelectorAll('#tabbar button').forEach(function(b){b.addEventListener('click',function(){curTab=b.dataset.tab;renderTrainee()})});
function renderTrainee(){
  document.querySelectorAll('#tabbar button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===curTab)});
  if(curTab==='path')renderPath(); else if(curTab==='learn')renderLearn();
  else if(curTab==='checklist')renderChecklist(); else renderLicence();
}
function stageLadderHTML(){
  var list=STAGES[me.track], cur=me.stage||list[0][0], ci=list.findIndex(function(s){return s[0]===cur});
  return list.map(function(s,i){var cls=i<ci?'done':(i===ci?'here':'');
    return '<div class="stage '+cls+'"><div class="dot">'+s[0]+'</div><div><div class="sn">'+esc(s[1])+'</div><div class="sd">'+esc(s[2])+(i===ci?' — You are here':'')+(i<ci?' — Completed':'')+'</div></div></div>'}).join('');
}
function renderPath(){
  var d=pctDone();
  var gate=prog&&prog.gate_decision?({'graduate':'🎓 Graduate — congratulations!','reshadow':'Extra shadowing + re-take','meeting':'Decision meeting — talk to your teacher'}[prog.gate_decision]||''):'';
  app.innerHTML='<h2>My Path — '+(me.track==='pest'?'Pest Control':'Wildlife')+'</h2>'
   +(gate?'<div class="okbox"><b>Teacher gate decision:</b> '+esc(gate)+'</div>':'')
   +'<div class="card"><div class="row"><div class="grow"><b>Academy modules</b><div class="small dim">'+d.n+' of '+d.total+' complete</div></div><span class="pill red">'+d.pct+'%</span></div><div class="bar"><i style="width:'+d.pct+'%"></i></div></div>'
   +'<div class="card"><h3 style="margin-top:0">Your stages</h3>'+stageLadderHTML()+'</div>'
   +'<div class="card"><h3 style="margin-top:0">Licence milestones</h3>'+milestoneListHTML()+'<p class="small dim">Your teacher records the dates. Full list is on the Licence tab.</p></div>';
}
function milestoneListHTML(){
  var set={}; if(prog&&prog.milestones)prog.milestones.forEach(function(m){set[m.milestone_key]=m});
  return MILESTONES[me.track].map(function(m,i){var got=set[m[0]];
    return '<div class="stage '+(got?'done':'')+'"><div class="dot">'+(got?'✓':(i+1))+'</div><div><div class="sn" style="font-size:.95rem">'+esc(m[1])+'</div><div class="sd">'+(got?('Recorded '+fmtDate(got.milestone_date)):'Not recorded yet')+'</div></div></div>'}).join('');
}
function renderLicence(){
  app.innerHTML='<h2>Licence Milestones — '+(me.track==='pest'?'Pest Control':'Wildlife')+'</h2>'
   +'<div class="card">'+milestoneListHTML()+'</div>'
   +(me.track==='pest'
     ?'<div class="card"><h3 style="margin-top:0">The QualityPro order</h3><p>Apprentice first, working under supervision. Then the DEC-approved 30-hour course and the Core + Category 7A exams (50 questions each, 70% to pass) for your DEC Technician licence in 7A. After 1 year as a licensed Technician, you apply for the Certified Applicator licence.</p></div>'
     :'<div class="card"><h3 style="margin-top:0">The NWCO route</h3><p>Complete NWCO training (site evaluation, non-lethal methods, exclusion, habitat modification, capture &amp; handling), pass the DEC exam at 80% or higher — the DEC exam is free, or the NWCTP online course is $200 — then apply for the licence: $50/year, expires September 30. NWCOs file an annual report to DEC.</p></div>');
}
function renderChecklist(){
  var set={}; if(prog&&prog.signoffs)prog.signoffs.forEach(function(s){set[s.item_key]=s});
  var items=CHECKLISTS[me.track], signed=items.filter(function(i){return set[i[0]]}).length;
  app.innerHTML='<h2>My Practical Checklist</h2>'
   +'<div class="notice">These items can only be signed by your teacher, in person. You can watch your progress here, but you can\u2019t sign them yourself.</div>'
   +'<div class="card"><div class="row"><b>'+signed+' of '+items.length+' signed</b></div>'
   + items.map(function(i){var s=set[i[0]];
     return '<div class="checkrow"><div>'+esc(i[1])+'</div><div class="st">'+(s?'<span class="pill ok">Signed</span><div class="small dim">by '+esc(s.signed_by)+' · '+fmtDate(s.signed_at)+'</div>':'<span class="pill warn">Needs teacher sign-off</span>')+'</div></div>'}).join('')
   +'</div>';
}
function renderLearn(){
  var done=completedSet(), mock=MOCK[me.track];
  var unlocked=mock.need.every(function(k){return done[k]});
  var lastMock=prog&&prog.mock_exams&&prog.mock_exams.length?prog.mock_exams[prog.mock_exams.length-1]:null;
  var html='<h2>Learn — '+(me.track==='pest'?'Pest Control':'Wildlife')+'</h2>';
  html+='<div class="card tap" id="mockCard"><div class="row"><div class="grow"><b>'+esc(mock.name)+'</b><div class="small dim">Pass mark '+mock.pass+'% · '+(unlocked?'Unlocked':'Locked — finish all Week 1–3 modules first')+(lastMock?(' · Last: '+lastMock.pct+'% ('+(lastMock.passed?'passed':'not yet')+')'):'')+'</div></div><span class="pill '+(unlocked?'red':'')+'">'+(unlocked?'START':'🔒')+'</span></div></div>';
  var wk=0;
  MODULES[me.track].forEach(function(m){
    if(m.week!==wk){wk=m.week; html+='<h3>Week '+wk+'</h3>'}
    var isDone=!!done[m.id];
    html+='<div class="card"><button class="modhead" data-mod="'+m.id+'"><span class="pill '+(isDone?'ok':'red')+'">'+m.id+'</span><span class="grow" style="text-align:left"><b>'+esc(m.title)+'</b></span><span>'+(isDone?'✓':'›')+'</span></button><div class="lessons" id="les-'+m.id+'"></div></div>';
  });
  app.innerHTML=html;
  document.querySelectorAll('.modhead').forEach(function(b){b.addEventListener('click',function(){
    var box=document.getElementById('les-'+b.dataset.mod);
    if(box.classList.contains('open')){box.classList.remove('open');box.innerHTML='';return}
    document.querySelectorAll('.lessons.open').forEach(function(x){x.classList.remove('open');x.innerHTML=''});
    box.classList.add('open'); drawLesson(box, MODULES[me.track].find(function(m){return m.id===b.dataset.mod}));
  })});
  document.getElementById('mockCard').addEventListener('click',function(){
    if(!unlocked){openModal('<h3>'+esc(mock.name)+'</h3><p>This mock unlocks when your Week 1–3 modules are all complete:</p><p style="margin:10px 0">'+mock.need.map(function(k){return '<span class="pill '+(done[k]?'ok':'')+'">'+k+(done[k]?' ✓':'')+'</span>'}).join(' ')+'</p><button class="ghost" style="width:100%" onclick="void(0)" id="mClose">Close</button>');document.getElementById('mClose').addEventListener('click',closeModal);return}
    startMock(mock);
  });
}
function drawLesson(box,m){
  box.innerHTML='<ul class="kp">'+m.points.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul>'
   +'<h3>Check yourself — 80% to pass</h3><div id="qz-'+m.id+'">'
   + m.quiz.map(function(q,qi){return '<p style="margin-top:12px"><b>'+(qi+1)+'.</b> '+esc(q[0])+'</p>'+q[1].map(function(o,oi){return '<button class="qopt" data-q="'+qi+'" data-o="'+oi+'">'+esc(o)+'</button>'}).join('')}).join('')
   +'</div><div class="err" id="qzErr-'+m.id+'"></div><button class="primary" id="qzGo-'+m.id+'" style="width:100%">Submit quiz</button>';
  var picks={};
  box.querySelectorAll('.qopt').forEach(function(b){b.addEventListener('click',function(){
    picks[b.dataset.q]=+b.dataset.o;
    box.querySelectorAll('.qopt[data-q="'+b.dataset.q+'"]').forEach(function(x){x.classList.toggle('sel',x===b)});
  })});
  document.getElementById('qzGo-'+m.id).addEventListener('click',function(){
    var err=document.getElementById('qzErr-'+m.id);
    if(Object.keys(picks).length<m.quiz.length){err.textContent='Answer every question first.';return}
    var score=0; m.quiz.forEach(function(q,qi){if(picks[qi]===q[2])score++});
    sendProgress('academy_record_quiz',{p_module_key:m.id,p_score:score,p_total:m.quiz.length}).then(function(res){
      var pct=Math.round(score/m.quiz.length*100);
      if(res&&typeof res.pct==='number')pct=res.pct;
      if(pct>=80){localDone[m.id]=true;store('qpa_local_done',localDone)}
      loadProgress().then(function(){
        openModal('<h3>'+(pct>=80?'Passed — '+pct+'%':'Not yet — '+pct+'%')+'</h3><p>'+(pct>=80?'Module '+m.id+' is complete and saved.':'You need 80% to pass. Review the key points and try again — your attempt was saved.')+'</p><button class="primary" id="mOk" style="width:100%;margin-top:12px">Keep going</button>');
        document.getElementById('mOk').addEventListener('click',function(){closeModal();renderLearn()});
      });
    });
  });
}
/* Mock exam */
var mockState=null, mockInt=null;
function stopMockTimer(){if(mockInt){clearInterval(mockInt);mockInt=null}}
function startMock(mock){
  var pool=[]; MODULES[me.track].forEach(function(m){m.quiz.forEach(function(q){pool.push({q:q,from:m.id})})});
  var qs=[]; for(var i=0;i<pool.length&&qs.length<10;i+=2)qs.push(pool[i]);
  mockState={mock:mock,qs:qs,picks:{},left:15*60,t0:Date.now()};
  openModal('<div class="row"><h3 class="grow" style="margin:0">'+esc(mock.name)+'</h3><span class="timer" id="mTimer">15:00</span></div>'
   +'<p class="small dim">Pass mark '+mock.pass+'%. Answer all '+qs.length+' questions.</p><div id="mQs">'
   + qs.map(function(it,qi){return '<p style="margin-top:12px"><b>'+(qi+1)+'.</b> '+esc(it.q[0])+'</p>'+it.q[1].map(function(o,oi){return '<button class="qopt mq" data-q="'+qi+'" data-o="'+oi+'">'+esc(o)+'</button>'}).join('')}).join('')
   +'</div><div class="err" id="mErr"></div><button class="primary" id="mGo" style="width:100%">Submit exam</button>');
  modalSheet.querySelectorAll('.mq').forEach(function(b){b.addEventListener('click',function(){
    mockState.picks[b.dataset.q]=+b.dataset.o;
    modalSheet.querySelectorAll('.mq[data-q="'+b.dataset.q+'"]').forEach(function(x){x.classList.toggle('sel',x===b)});
  })});
  function tick(){var t=document.getElementById('mTimer');if(!t){stopMockTimer();return}
    mockState.left--; var mm=Math.floor(mockState.left/60), ss=mockState.left%60;
    t.textContent=mm+':'+(ss<10?'0':'')+ss; if(mockState.left<=0){stopMockTimer();submitMock()}}
  mockInt=setInterval(tick,1000);
  document.getElementById('mGo').addEventListener('click',submitMock);
  function submitMock(){
    if(!mockState)return; stopMockTimer();
    var picks=mockState.picks, qs2=mockState.qs, err=document.getElementById('mErr');
    if(Object.keys(picks).length<qs2.length){if(err)err.textContent='Answer every question first.'; mockInt=setInterval(tick,1000); return}
    var score=0; qs2.forEach(function(it,qi){if(picks[qi]===it.q[2])score++});
    var dur=Math.round((Date.now()-mockState.t0)/1000), mk=mockState.mock; mockState=null;
    sendProgress('academy_record_mock',{p_exam_key:mk.key,p_score:score,p_total:qs2.length,p_duration_sec:dur}).then(function(res){
      var pct=Math.round(score/qs2.length*100); if(res&&typeof res.pct==='number')pct=res.pct;
      var passed=pct>=mk.pass;
      loadProgress().then(function(){
        openModal('<h3>'+(passed?'Mock passed — '+pct+'%':'Mock not passed — '+pct+'%')+'</h3><p>Pass mark is '+mk.pass+'%. Your result was saved'+(res?'':' on this phone and will send when you are back online')+'.</p><button class="primary" id="mOk2" style="width:100%;margin-top:12px">Done</button>');
        document.getElementById('mOk2').addEventListener('click',function(){closeModal();renderLearn()});
      });
    });
  }
}
</script>

<script>
/* ------------------------------ Teacher ------------------------------ */
var dashRows=[];
function teacherCall(fn,args){ args=args||{}; args.p_token=session.token; return rpc(fn,args); }
function gatePill(row){
  var total=MODULES[row.track]?MODULES[row.track].length:0;
  var label={graduate:'Graduate',meeting:'Decision meeting',gate_failed:'Gate failed',on_track:'On track'}[row.gate_status]||row.gate_status;
  var cls=row.gate_status==='graduate'?'ok':(row.gate_status==='on_track'?'warn':'bad');
  var pct=total?Math.round((row.modules_completed||0)/total*100):0;
  return {label:label,cls:cls,pct:pct,total:total};
}
function renderTeacher(){
  app.innerHTML='<h2>Teacher — Cohorts</h2><div id="tBody"><p class="dim">Loading…</p></div>';
  Promise.all([rpc('academy_list_cohorts',{}), teacherCall('academy_teacher_dashboard',{})]).then(function(r){
    cohortsCache=r[0]||[]; dashRows=r[1]||[];
    var body=document.getElementById('tBody'); if(!body)return;
    var html='<div class="card"><h3 style="margin-top:0">Create a cohort</h3>'
     +'<label>Cohort name</label><input id="cName" placeholder="e.g. Cohort 1">'
     +'<label>Path</label><div class="seg" id="cTrack"><button data-t="pest" class="on">Pest Control</button><button data-t="wildlife">Wildlife</button></div>'
     +'<label>Start date (optional — can stay blank)</label><input id="cDate" type="date">'
     +'<div class="err" id="cErr"></div><button class="primary" id="cGo" style="width:100%">Create cohort</button></div>';
    html+='<div class="card"><h3 style="margin-top:0">Add a trainee</h3>'
     +'<label>Cohort</label><select id="atCohort">'+cohortsCache.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+' ('+(c.track==='pest'?'Pest':'Wildlife')+')</option>'}).join('')+'</select>'
     +'<label>Trainee name</label><input id="atName">'
     +'<p class="small dim">The trainee sets their own PIN the first time they sign in.</p>'
     +'<div class="err" id="atErr"></div><button class="primary" id="atGo" style="width:100%">Add trainee</button></div>';
    html+='<h2>Cohort Dashboard</h2>';
    if(!dashRows.length) html+='<div class="card"><p class="dim">No trainees yet. Create a cohort and add trainees above — or a trainee can register themselves from the sign-in screen.</p></div>';
    dashRows.forEach(function(row){
      var g=gatePill(row);
      html+='<div class="card tap" data-rec="'+row.user_id+'"><div class="row"><div class="grow"><b>'+esc(row.name)+'</b><div class="small dim">'+esc(row.cohort_name||'No cohort')+' · '+(row.track==='pest'?'Pest':'Wildlife')+' · Stage '+esc(row.stage||'')+'</div></div><span class="pill '+g.cls+'">'+g.label+'</span></div>'
       +'<div class="bar"><i style="width:'+g.pct+'%"></i></div>'
       +'<div class="small dim">Modules '+g.pct+'% · Quiz avg '+(row.quiz_avg!=null?row.quiz_avg+'%':'—')+' · Mock '+(row.mock_latest?(row.mock_latest.pct+'% '+(row.mock_latest.passed?'(passed)':'(not yet)')):'not taken')+' · Sign-offs '+row.signoffs+'/'+(CHECKLISTS[row.track]?CHECKLISTS[row.track].length:0)+(row.gate_decision?' · Decision: '+esc(row.gate_decision):'')+'</div></div>';
    });
    body.innerHTML=html;
    var cTrack='pest';
    body.querySelectorAll('#cTrack button').forEach(function(b){b.addEventListener('click',function(){cTrack=b.dataset.t;body.querySelectorAll('#cTrack button').forEach(function(x){x.classList.toggle('on',x===b)})})});
    document.getElementById('cGo').addEventListener('click',function(){
      var name=document.getElementById('cName').value.trim(), d=document.getElementById('cDate').value||null, err=document.getElementById('cErr');
      if(!name){err.textContent='Give the cohort a name first.';return}
      teacherCall('academy_create_cohort',{p_name:name,p_track:cTrack,p_start_date:d}).then(function(){renderTeacher()},function(e){err.textContent=friendlyErr(e)});
    });
    document.getElementById('atGo').addEventListener('click',function(){
      var cid=document.getElementById('atCohort').value, name=document.getElementById('atName').value.trim(), err=document.getElementById('atErr');
      if(!cid){err.textContent='Create a cohort first.';return}
      if(!name){err.textContent='Enter the trainee\u2019s name.';return}
      teacherCall('academy_add_trainee',{p_cohort_id:cid,p_name:name}).then(function(){renderTeacher()},function(e){err.textContent=friendlyErr(e)});
    });
    body.querySelectorAll('[data-rec]').forEach(function(c){c.addEventListener('click',function(){renderTraineeRecord(c.dataset.rec)})});
  },function(e){var b=document.getElementById('tBody'); if(b)b.innerHTML='<div class="notice">'+esc(friendlyErr(e))+'</div>'});
}
function renderTraineeRecord(uid){
  app.innerHTML='<h2>Trainee Record</h2><div id="rBody"><p class="dim">Loading…</p></div>';
  teacherCall('academy_trainee_record',{p_user_id:uid}).then(function(rec){
    var u=rec.user, body=document.getElementById('rBody'); if(!body)return;
    me._recTrack=u.track; // not used for own views; teacher only
    var done={}; (rec.completed_modules||[]).forEach(function(k){done[k]=true});
    var total=MODULES[u.track].length, ndone=(rec.completed_modules||[]).length;
    var signed={}; (rec.signoffs||[]).forEach(function(s){signed[s.item_key]=s});
    var ms={}; (rec.milestones||[]).forEach(function(m){ms[m.milestone_key]=m});
    var html='<button class="ghost" id="rBack">← Back to dashboard</button>';
    html+='<div class="card"><div class="row"><div class="grow"><b>'+esc(u.name)+'</b><div class="small dim">'+(u.track==='pest'?'Pest Control':'Wildlife')+' · Stage '+esc(u.stage||'')+'</div></div><span class="pill red">'+Math.round(ndone/total*100)+'% modules</span></div>'
     +'<div class="small dim" style="margin-top:6px">Quizzes: '+(rec.quiz_attempts.length?rec.quiz_attempts.map(function(a){return a.module_key+' '+a.pct+'%'}).join(' · '):'none yet')+'</div>'
     +'<div class="small dim">Mock exams: '+(rec.mock_exams.length?rec.mock_exams.map(function(a){return a.exam_key+' '+a.pct+'% ('+(a.passed?'passed':'not yet')+')'}).join(' · '):'none yet')+'</div>'
     +((rec.stage_history&&rec.stage_history.length)?'<div class="small dim">Promotions: '+rec.stage_history.map(function(h){return esc(h.from_stage||'—')+' → '+esc(h.to_stage)+' by '+esc(h.promoted_by)+' · '+fmtDate(h.created_at)}).join(' · ')+'</div>':'')
     +'</div>';
    html+='<div class="card"><h3 style="margin-top:0">Promote stage</h3><div class="row"><select id="pStage" class="grow">'+STAGES[u.track].map(function(s){return '<option value="'+s[0]+'"'+(s[0]===u.stage?' selected':'')+'>'+s[0]+' — '+esc(s[1])+'</option>'}).join('')+'</select><button class="primary" id="pGo">Promote</button></div></div>';
    html+='<div class="card"><h3 style="margin-top:0">Practical sign-offs (tap to sign)</h3>'
     + CHECKLISTS[u.track].map(function(i){var s=signed[i[0]];
       return '<div class="checkrow"><div>'+esc(i[1])+'<div class="small dim">'+(s?('Signed by '+esc(s.signed_by)+' · '+fmtDate(s.signed_at)):'Not signed')+'</div></div><div class="st">'+(s?'<button class="ghost" data-unsign="'+i[0]+'">Undo</button>':'<button class="primary" data-sign="'+i[0]+'">Sign</button>')+'</div></div>'}).join('')+'</div>';
    html+='<div class="card"><h3 style="margin-top:0">Licence milestones</h3>'
     + MILESTONES[u.track].map(function(m){var got=ms[m[0]];
       return '<div class="checkrow"><div>'+esc(m[1])+'<div class="small dim">'+(got?('Recorded '+fmtDate(got.milestone_date)+' by '+esc(got.set_by)):'Not recorded')+'</div></div><div class="st row"><input type="date" id="ms-'+m[0]+'" value="'+(got?String(got.milestone_date).slice(0,10):'')+'" style="width:150px"><button class="primary" data-ms="'+m[0]+'">Set</button></div></div>'}).join('')+'</div>';
    html+='<div class="card"><h3 style="margin-top:0">Gate decision</h3><div class="grid2">'
     +'<button data-gate="graduate" class="'+(rec.gate_decision==='graduate'?'primary':'ghost')+'">🎓 Graduate</button>'
     +'<button data-gate="reshadow" class="'+(rec.gate_decision==='reshadow'?'primary':'ghost')+'">Extra shadowing + re-take</button>'
     +'<button data-gate="meeting" class="'+(rec.gate_decision==='meeting'?'primary':'ghost')+'">Decision meeting</button></div>'
     +'<div class="err" id="rErr"></div></div>';
    html+='<button class="ghost" id="rRemove" style="width:100%;color:#ff9c9c;border-color:#5a2b2b">Remove this trainee</button>';
    body.innerHTML=html;
    document.getElementById('rBack').addEventListener('click',renderTeacher);
    document.getElementById('pGo').addEventListener('click',function(){
      teacherCall('academy_promote_stage',{p_user_id:uid,p_to_stage:document.getElementById('pStage').value}).then(function(){renderTraineeRecord(uid)},function(e){document.getElementById('rErr').textContent=friendlyErr(e)});
    });
    body.querySelectorAll('[data-sign]').forEach(function(b){b.addEventListener('click',function(){
      teacherCall('academy_sign_item',{p_user_id:uid,p_item_key:b.dataset.sign}).then(function(){renderTraineeRecord(uid)},function(e){document.getElementById('rErr').textContent=friendlyErr(e)});
    })});
    body.querySelectorAll('[data-unsign]').forEach(function(b){b.addEventListener('click',function(){
      teacherCall('academy_unsign_item',{p_user_id:uid,p_item_key:b.dataset.unsign}).then(function(){renderTraineeRecord(uid)},function(e){document.getElementById('rErr').textContent=friendlyErr(e)});
    })});
    body.querySelectorAll('[data-ms]').forEach(function(b){b.addEventListener('click',function(){
      var d=document.getElementById('ms-'+b.dataset.ms).value; var err=document.getElementById('rErr');
      if(!d){err.textContent='Pick a date for that milestone first.';return}
      teacherCall('academy_set_milestone',{p_user_id:uid,p_milestone_key:b.dataset.ms,p_date:d}).then(function(){renderTraineeRecord(uid)},function(e){err.textContent=friendlyErr(e)});
    })});
    body.querySelectorAll('[data-gate]').forEach(function(b){b.addEventListener('click',function(){
      teacherCall('academy_set_gate',{p_user_id:uid,p_decision:b.dataset.gate}).then(function(){renderTraineeRecord(uid)},function(e){document.getElementById('rErr').textContent=friendlyErr(e)});
    })});
    document.getElementById('rRemove').addEventListener('click',function(){
      if(!confirm('Remove '+u.name+' from the Academy? Their records stay saved but they can no longer sign in.'))return;
      teacherCall('academy_remove_trainee',{p_user_id:uid}).then(function(){renderTeacher()},function(e){document.getElementById('rErr').textContent=friendlyErr(e)});
    });
  },function(e){var b=document.getElementById('rBody'); if(b)b.innerHTML='<button class="ghost" onclick="location.reload()">← Retry</button><div class="notice">'+esc(friendlyErr(e))+'</div>'});
}

/* ------------------------------ Boot ------------------------------ */
function boot(){
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
  Promise.all([rpc('academy_list_names',{}).catch(function(){return[]}), rpc('academy_list_cohorts',{}).catch(function(){return[]})]).then(function(r){
    namesCache=r[0]||[]; cohortsCache=r[1]||[];
    if(session&&session.token){
      rpc('academy_session_user',{p_token:session.token}).then(function(u){
        if(!u){signOut();return}
        me=u; session={name:u.name,role:u.role,token:session.token}; store('qpa_session',session);
        setHeader(); flushQueue(); enterApp();
      },function(){renderAuth()});
    } else renderAuth();
  });
}
boot();
</script>
</body>
</html>
